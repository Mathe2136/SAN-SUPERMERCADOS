<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>TechStore</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .titulo {
        text-align: center;
        margin-bottom: 20px;
      }

     .titulo img {
  width: 180px;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
} 
    .grid {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .produto {
      background: white;
      border-radius: 10px;
      padding: 15px;
      width: 180px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .produto img {
      width: 100%;
      border-radius: 8px;
    }

    .preco {
      font-weight: bold;
      color: green;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .carrinho {
      background: white;
      padding: 15px;
      margin: 20px auto;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .mensagem {
      text-align: center;
      color: green;
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">

function Produto({ nome, preco, imagem, comprar }) {
  return (
    <div className="produto">
      <img src={imagem} alt={nome} />
      <h3>{nome}</h3>
      <p className="preco">R$ {preco}</p>
      <button onClick={comprar}>Adicionar</button>
    </div>
  );
}

function App() {
  const [carrinho, setCarrinho] = React.useState([]);
  const [mensagem, setMensagem] = React.useState("");

  function adicionarProduto(nome) {
    setCarrinho([...carrinho, nome]);
    setMensagem(nome + " adicionado ao carrinho!");
  }

  return (
    <div>
      <div className="titulo">
        <img src="https://vilanova.itashopping.com.br/wp-content/uploads/2020/08/2-2.png" alt="Logo da loja" />
      </div>

      <div className="carrinho">
        <h2> Carrinho ({carrinho.length})</h2>
        <ul>
          {carrinho.map((item, index) => (
            <li key={index}>{item}</li>
          ))}
        </ul>
      </div>

      <p className="mensagem">{mensagem}</p>
